<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3d6b3a" />
    <title>Auto Battler 3D — Lab</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <div id="hud">
      <h1>Lab View</h1>
      <p>Drag to orbit · Pinch / scroll to zoom</p>
    </div>
    <div id="controls">
      <button type="button" id="btnOpenFire">Open Fire</button>
      <button type="button" id="btnCeaseFire">Cease Fire</button>
      <button type="button" id="btnRedAdvance">Red Advance</button>
      <button type="button" id="btnDestroyAll">Destroy All</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
