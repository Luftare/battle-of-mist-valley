<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bake thumbs</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
        color: #cde;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #status {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.6);
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        opacity: 0.65;
        font-size: 12px;
        max-width: 28rem;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting…</div>
    <p id="hint">
      Add models in <code>src/thumbs/registry.ts</code>, then
      <code>npm run bake-thumbs</code>. Subset:
      <code>?ids=rifleman,tank</code>
    </p>
    <script type="module" src="/src/thumbs/bakePage.ts"></script>
  </body>
</html>
